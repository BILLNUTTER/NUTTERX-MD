<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUTTERX-MD · Session Generator</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --accent: #25d366;
      --accent-dim: #1da851;
      --danger: #e5534b;
      --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 0%, #1b2230 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }

    .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 12px var(--accent);
    }

    h1 { font-size: 20px; margin: 0; letter-spacing: .3px; }

    .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 22px; }

    label {
      display: block; font-size: 12px; color: var(--muted);
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: .6px;
    }

    input {
      width: 100%; padding: 12px 14px; background: #12151b;
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 15px; font-family: var(--mono);
      outline: none; transition: border-color .15s;
    }

    input:focus { border-color: var(--accent); }

    .row { display: flex; gap: 10px; margin-top: 14px; }

    button {
      flex: 1; padding: 12px 14px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: transform .08s, background .15s;
      color: #0b0e13; background: var(--accent);
    }

    button:hover { background: var(--accent-dim); }
    button:active { transform: scale(.98); }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #232733; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #result { margin-top: 22px; }

    .panel {
      background: #12151b; border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
    }

    .panel h3 {
      margin: 0 0 12px; font-size: 13px; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px; font-weight: 600;
    }

    .code {
      font-family: var(--mono); font-size: 26px; font-weight: 700;
      letter-spacing: 6px; color: var(--accent); text-align: center;
      padding: 14px 0; background: #0b0e13; border-radius: 10px;
      border: 1px dashed var(--border); margin: 0 0 12px;
    }

    .hint { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 0; }

    .hint code {
      background: #232733; padding: 1px 6px; border-radius: 4px;
      font-family: var(--mono); font-size: 11px;
    }

    .qr-wrap { text-align: center; }
    .qr-wrap img {
      width: 260px; height: 260px; border-radius: 12px;
      background: #fff; padding: 8px;
    }

    .session-box { display: flex; gap: 8px; align-items: stretch; margin: 10px 0; }

    .session-input {
      flex: 1; font-family: var(--mono); font-size: 11px;
      line-height: 1.5; word-break: break-all; background: #0b0e13;
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; color: #b9c2d0; resize: none;
      height: 90px; overflow-y: auto; outline: none;
    }

    .copy-btn {
      flex: 0 0 auto; padding: 0 18px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      color: #0b0e13; background: var(--accent); transition: background .15s;
    }

    .copy-btn:hover { background: var(--accent-dim); }
    .copy-btn.copied { background: #4caf50; color: #fff; }

    .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

    .spinner {
      width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: var(--danger); font-size: 13px; line-height: 1.6; margin: 0; }

    .success-badge {
      display: inline-block; font-size: 12px; font-weight: 600;
      color: #0b0e13; background: var(--accent);
      padding: 3px 10px; border-radius: 999px; margin-bottom: 10px;
    }

    /* Toast Notification Styles */
    #toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--card);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--danger);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(-20px);
      animation: slideIn 0.3s forwards, fadeOut 0.3s 2.7s forwards;
      pointer-events: auto;
    }

    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <main class="card">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>NUTTERX-MD</h1>
    </div>
    <p class="subtitle">Generate a session ID to deploy your bot on Heroku.</p>

    <label for="phone">WhatsApp phone number</label>
    <input id="phone" placeholder="e.g. 15551234567" autocomplete="off" />

    <div class="row">
      <button id="btnCode" onclick="startPairing('code')">Get pairing code</button>
      <button id="btnQr" class="secondary" onclick="startPairing('qr')">Use QR code</button>
    </div>

    <div id="result"></div>
  </main>

  <script>
    let pollTimer = null;

    // Toast Notification Function
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      
      container.appendChild(toast);
      
      // Remove from DOM after animation ends (3 seconds)
      setTimeout(() => {
        if (toast.parentNode) {
          toast.parentNode.removeChild(toast);
        }
      }, 3000);
    }

    function clearPoll() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    function setButtonsDisabled(disabled) {
      document.getElementById('btnCode').disabled = disabled;
      document.getElementById('btnQr').disabled = disabled;
    }

    function showStarting(message = 'Connecting to WhatsApp…') {
      document.getElementById('result').innerHTML = `
        <div class="panel">
          <div class="status"><span class="spinner"></span>${message}</div>
        </div>
      `;
    }

    function showError(message) {
      clearPoll();
      setButtonsDisabled(false);
      document.getElementById('result').innerHTML = `
        <div class="panel">
          <h3>Something went wrong</h3>
          <p class="error">${message}</p>
        </div>
      `;
    }

    function showCode(code) {
      document.getElementById('result').innerHTML = `
        <div class="panel">
          <h3>Enter this code on your phone</h3>
          <p class="code">${code}</p>
          <p class="hint">
            Open WhatsApp → <strong>Linked Devices</strong> → <strong>Link with phone number</strong>,
            then enter the code above. Keep this page open while waiting.
          </p>
        </div>
      `;
    }

    function showQr(qrDataUrl) {
      document.getElementById('result').innerHTML = `
        <div class="panel qr-wrap">
          <h3>Scan with WhatsApp</h3>
          <img src="${qrDataUrl}" alt="WhatsApp QR code" />
          <p class="hint">
            Open WhatsApp → <strong>Linked Devices</strong> → <strong>Link a device</strong>,
            and scan the QR code.
          </p>
        </div>
      `;
    }

    function showConnected(sessionId) {
      clearPoll();
      setButtonsDisabled(false);
      document.getElementById('result').innerHTML = `
        <div class="panel">
          <span class="success-badge">Connected</span>
          <h3>Your session ID</h3>
          <div class="session-box">
            <textarea id="sessionInput" class="session-input" readonly>${sessionId}</textarea>
            <button class="copy-btn" id="copyBtn" onclick="copySession()">Copy</button>
          </div>
          <p class="hint">
            Copy the full string above and paste it into Heroku's
            <code>SESSION_ID</code> config var. Then deploy — your bot will come online 24/7.
          </p>
        </div>
      `;
    }

    async function copySession() {
      const input = document.getElementById('sessionInput');
      const btn = document.getElementById('copyBtn');
      if (!input || !btn) return;

      const text = input.value;

      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          input.select();
          input.setSelectionRange(0, text.length);
          document.execCommand('copy');
        }
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy';
          btn.classList.remove('copied');
        }, 1500);
      } catch (err) {
        input.focus();
        input.select();
        showToast('Could not copy automatically. Press Ctrl+C / Cmd+C.');
      }
    }

    async function startPairing(mode) {
      clearPoll();
      setButtonsDisabled(true);

      const phone = document.getElementById('phone').value.trim();

      // Reverted: Only Pairing Code mode requires a phone number.
      // QR mode extracts it automatically on the backend.
      if (mode === 'code' && !phone) {
        setButtonsDisabled(false);
        showToast('Enter your WhatsApp phone number first.');
        return;
      }

      showStarting(mode === 'qr' ? 'Generating QR code…' : 'Requesting pairing code…');

      let data;
      try {
        const res = await fetch('/api/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, mode })
        });
        data = await res.json();
      } catch (err) {
        return showError('Network error: ' + err.message);
      }

      if (data.error) return showError(data.error);

      // Backend returns { sessionKey, status: 'starting' }.
      pollTimer = setInterval(async () => {
        try {
          const r = await fetch(`/api/pair/${data.sessionKey}`);
          const d = await r.json();

          if (d.status === 'error') {
            return showError(d.error || 'Unknown error');
          }

          if (d.status === 'code_ready' && d.code) {
            showCode(d.code);
          } else if (d.status === 'qr_ready' && d.qr) {
            showQr(d.qr);
          } else if (d.status === 'connected' && d.sessionId) {
            showConnected(d.sessionId);
          }
        } catch (err) {
          // Ignore transient polling errors
        }
      }, 1500);
    }
  </script>
</body>
</html>
